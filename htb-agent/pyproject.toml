[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htb-agent"
version = "2.7.9"   # src/htb_agent/__init__.py 의 __version__ 과 일치시킬 것
description = "HTB 머신 승인제 풀이 에이전트 (권한 확인 자산 한정, 레드팀 학습용)"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
config = ["pyyaml>=6.0"]
# 웹 RCE 발판 채널(shell_transport.web_http_fn)용 — 선택. 미설치면 발판 미확보로 안전 degrade.
exploit = ["requests>=2.25"]

[project.scripts]
# 정식 명령은 'assassin'. 'htb-agent' 는 하위호환 별칭(동일 진입점).
assassin = "htb_agent.main:main"
htb-agent = "htb_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# 지식베이스(knowledge/)·벤치(bench/)는 프로젝트 루트에 있고 패키지(src/htb_agent) 안이
# 아니므로, 아래 glob 은 'htb_agent/knowledge 로 복사한 경우에만' 매칭된다(미복사 시 wheel
# 에는 KB 가 포함되지 않는다). 기본 사용은 소스 트리 / pip install -e . / --knowledge <경로>.
# sdist 에는 MANIFEST.in(graft) 으로 포함된다.
[tool.setuptools.package-data]
htb_agent = ["knowledge/**/*", "bench/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # 라인 길이는 경고만(한국어 주석 고려)
