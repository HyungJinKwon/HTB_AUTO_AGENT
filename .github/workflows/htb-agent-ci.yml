name: htb-agent CI

on:
  push:
    paths: ["htb-agent/**", ".github/workflows/htb-agent-ci.yml"]
  pull_request:
    paths: ["htb-agent/**", ".github/workflows/htb-agent-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: htb-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 전체 테스트 (표준 라이브러리만, 외부 의존성 없음)
        run: python3 tests/run_all.py
      - name: 컴파일 체크
        run: python3 -m py_compile src/htb_agent/*.py src/htb_agent/*/*.py
      - name: README CLI 옵션 표 최신 여부
        run: python3 scripts/gen_cli_docs.py --check

  lint:
    runs-on: ubuntu-latest
    # 게이트: src 의 ruff·mypy 0건을 유지한다(새 경고가 생기면 PR 실패). 버전 고정으로 결과 재현.
    defaults:
      run:
        working-directory: htb-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ruff lint (게이트)
        run: |
          pip install "ruff==0.16.8"
          ruff check src/
      - name: mypy 타입체크 (게이트)
        run: |
          pip install "mypy==2.3.1"
          mypy src/ --ignore-missing-imports

  foothold-e2e:
    runs-on: ubuntu-latest
    # ★ '가짜 아닌' 실 end-to-end: requests(.[exploit])를 깔고, 실 HTTP 웹셸 발판 체인을
    # 진짜로 돌린다(단위 테스트의 fake 주입이 놓친 실 경로 — urllib3/requests degrade 재발 방지).
    defaults:
      run:
        working-directory: htb-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 익스 실행 의존성 설치(requests)
        run: pip install -e ".[exploit]"
      - name: 실 웹 RCE 발판 e2e (loopback HTTP · 실 requests)
        run: python3 tests/test_e2e_real_foothold.py

  install-smoke:
    runs-on: ubuntu-latest
    # 새 가상환경에 설치해 'assassin' 명령이 소스 밖(다른 cwd)에서도 동작하는지 확인
    # (지식베이스 경로 cwd 독립 + 엔트리포인트). 네트워크 없이 동작하도록 ASSASSIN_NO_NET.
    defaults:
      run:
        working-directory: htb-agent
    env:
      ASSASSIN_NO_NET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 편집모드 설치
        run: pip install -e .
      - name: 소스 밖에서 --doctor (지식경로 cwd 독립)
        run: cd /tmp && assassin --doctor
      - name: 소스 밖에서 오프라인 벤치(규칙기반)
        run: cd /tmp && assassin --bench --offline
      - name: 하위호환 별칭(htb-agent) 동작
        run: cd /tmp && htb-agent --version
